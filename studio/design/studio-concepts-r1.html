.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition:
    color 150ms ease-out,
    transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (hover: hover) and (pointer: fine) {
  .proto-picker-item:hover {
    color: rgba(255, 255, 255, 0.85);
  }
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

let gameIndex=0,frame=0,playing=false;
const titleNames=['Workbench','Cartridge shelf','Playtest'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function header(){return '<div class="top"><div class="brand"><span class="mark" aria-hidden="true">'+('<i></i>'.repeat(9))+'</span>LAB Studio</div><span class="meta">Interface concepts &nbsp;/&nbsp; v0</span></div>';}
function art(g,idx){return '<img class="screen" alt="'+esc(g.title)+' game preview" src="'+g.frames[idx].image+'">';}
function screen(){let g=games[gameIndex];return '<div class="cab"><div class="screen-in">'+art(g,frame)+'</div><div class="screenfoot"><span>POCKET • 160 × 160</span><span>Frame '+g.frames[frame].tick+'</span></div></div>';}
function controls(){return '<div class="controls"><button class="control" data-cmd="replay">'+(playing?'Pause replay':'Play replay')+'</button><button class="control" data-cmd="next">Step →</button><button class="control" data-cmd="rewind">Rewind</button></div>';}
function library(cls){return games.map((g,i)=>'<button class="'+cls+'" data-game="'+i+'" aria-pressed="'+(gameIndex===i)+'">'+esc(g.title)+'</button>').join('');}
function workbench(){let g=games[gameIndex];return '<section class="app">'+header()+'<div class="work"><aside class="side"><p class="tag">Library</p>'+library('lib')+'</aside><div><p class="tag">Active cartridge</p><h1>'+esc(g.title)+'</h1><p class="desc">'+esc(g.description)+'</p>'+screen()+controls()+'</div><aside class="editor"><div class="editorhead"><h2>Source</h2><span class="meta">main.py</span></div><pre class="code">'+esc(g.excerpt)+'</pre></aside></div></section>';}
function shelf(){let g=games[gameIndex];return '<section class="app shelf">'+header()+'<div class="shelf-main"><p class="tag">Local projects</p><h1>Cartridge shelf</h1></div><div class="cartridges">'+games.map((item,i)=>'<button class="card" data-game="'+i+'" aria-pressed="'+(i===gameIndex)+'">'+art(item,i===gameIndex?frame:0)+'<strong>'+esc(item.title)+'</strong></button>').join('')+'</div><div class="shelf-base"><div><h2>'+esc(g.title)+'</h2><p class="desc">'+esc(g.description)+'</p><span class="small">Frame '+g.frames[frame].tick+'</span></div>'+controls()+'</div></section>';}
function playtest(){let g=games[gameIndex];return '<section class="app labtest">'+header()+'<div class="test-grid"><div>'+screen()+'</div><div><p class="tag">Playtest recorder</p><h1>'+esc(g.title)+'</h1><p class="desc">Scrub a recorded input sequence from the Studio runner.</p><div class="tapes">'+library('control')+'</div><input aria-label="Recorded frame" class="ruler" type="range" min="0" max="'+(g.frames.length-1)+'" value="'+frame+'"><div class="stats"><span>Tick '+g.frames[frame].tick+'</span><span>Score '+esc(g.frames[frame].score)+'</span></div>'+controls()+'</div></div></section>';}
const variants=[workbench,shelf,playtest];
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
function paint(focus){stage.innerHTML=variants[current]();if(focus)stage.querySelector(focus)?.focus({preventScroll:true});}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.game!=null){gameIndex=Number(b.dataset.game);frame=0;playing=false;paint('[data-game="'+gameIndex+'"]');return;}let cmd=b.dataset.cmd;let n=games[gameIndex].frames.length;if(cmd==='next'){playing=false;frame=(frame+1)%n;}if(cmd==='rewind'){playing=false;frame=0;}if(cmd==='replay')playing=!playing;paint('[data-cmd="'+cmd+'"]');});
stage.addEventListener('input',e=>{if(!e.target.matches('.ruler'))return;playing=false;frame=Number(e.target.value);const box=stage.querySelector('.cab');box.outerHTML=screen();stage.querySelector('.stats').innerHTML='<span>Tick '+games[gameIndex].frames[frame].tick+'</span><span>Score '+esc(games[gameIndex].frames[frame].score)+'</span>';stage.querySelector('[data-cmd="replay"]').textContent='Play replay';});
setInterval(()=>{if(playing){frame=(frame+1)%games[gameIndex].frames.length;const focus=document.activeElement?.dataset?.cmd;paint(focus?'[data-cmd="'+focus+'"]':undefined);}},260);
</script></body></html>
